<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeAura — Info</title>
  <meta name="description" content="Join the TypeAura testers group and get the app on Google Play." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="img/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .info-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    .info-glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(187,134,252,0.12) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      pointer-events: none;
    }

    .info-glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(138,180,248,0.1) 0%, transparent 70%);
      bottom: -80px;
      right: -80px;
      pointer-events: none;
    }

    .info-card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .info-icon {
      font-size: 52px;
      margin-bottom: 16px;
      display: block;
    }

    .info-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .info-subtitle {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--purple), var(--accent));
      color: #0F0F13;
      font-weight: 800;
      font-size: 16px;
      border-radius: 14px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 14px;
    }

    .btn-info:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-info:active { transform: translateY(0); }

    .btn-info.secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .info-note {
      font-size: 12px;
      color: var(--dim);
      line-height: 1.6;
    }

    .info-note strong { color: var(--text2); }

    .back-link {
      font-size: 13px;
      color: var(--text2);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 20px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent); }

    @media (max-width: 600px) {
      .info-page  { padding: 32px 16px; }
      .info-card  { padding: 32px 22px; border-radius: 20px; }
      .info-icon  { font-size: 44px; margin-bottom: 12px; }
      .info-title { font-size: 22px; }
      .info-subtitle { font-size: 13.5px; margin-bottom: 22px; }
      .btn-info   { padding: 15px; font-size: 15px; min-height: 50px; }
      .info-note  { font-size: 11.5px; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="/" style="text-decoration:none;display:flex;align-items:center;gap:8px">
        <img class="logo-mark" src="img/logo-mark.png" width="37" height="24" alt="" />
        <span class="logo-text">TypeAura</span>
      </a>
    </div>
  </nav>

  <!-- Main -->
  <main class="info-page">
    <div class="info-glow-1"></div>
    <div class="info-glow-2"></div>

    <div class="info-card">
      <span class="info-icon">ℹ️</span>
      <h1 class="info-title">TypeAura Info</h1>
      <p class="info-subtitle">
        Join our testers community and get TypeAura on Google Play.
      </p>

      <a href="https://groups.google.com/g/typeaura-testers" class="btn-info" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Join Testers Group
      </a>

      <a href="https://play.google.com/store/apps/details?id=com.typeaura.app" class="btn-info secondary" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 20.5V3.5c0-.6.4-1.1.9-1.3l10.3 10.3L3.9 21.8c-.5-.2-.9-.7-.9-1.3zm13.8-5.4L6.1 21.9l8.6-8.6 2.1 1.8zm3.6-4.2c.4.3.6.7.6 1.1s-.2.8-.6 1.1l-2.2 1.3-2.4-2.4 2.4-2.4 2.2 1.3zM6.1 2.1l10.7 6.8-2.1 1.8L6.1 2.1z"/>
        </svg>
        Get it on Google Play
      </a>

      <p class="info-note">
        Join the <strong>testers group</strong> first to unlock the Play Store listing.
      </p>
    </div>

    <a href="/" class="back-link">← Back to TypeAura home</a>
  </main>

</body>
</html>
